<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <!-- Main Blue Metallic Gradients -->
    <linearGradient id="npBlueGradH1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="30%" stop-color="#0080FF"/>
      <stop offset="100%" stop-color="#0040C8"/>
    </linearGradient>

    <linearGradient id="npBlueGradH2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#002B80"/>
      <stop offset="60%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#38B6FF"/>
    </linearGradient>

    <!-- Cyan Glow -->
    <linearGradient id="npCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0077FE"/>
    </linearGradient>

    <filter id="npNeonFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" stroke-width="0" in2="blur" operator="over"/>
    </filter>

    <clipPath id="npClipChamberH">
      <path d="M 68 34 L 98 34 C 110 34, 116 42, 116 57 C 116 72, 110 79, 95 79 L 68 79 Z"/>
    </clipPath>
  </defs>

  <!-- ==================== EMBLEM ICON (0 to 130) ==================== -->
  <g transform="translate(6, 4)">
    <!-- Speed streaks -->
    <rect x="0" y="38" width="18" height="3.5" rx="1.75" fill="#00D2FF" filter="url(#npNeonFilter)"/>
    <rect x="-4" y="45" width="22" height="4" rx="2" fill="#00F0FF"/>
    <rect x="2" y="53" width="16" height="3.5" rx="1.75" fill="#0088FF"/>
    <circle cx="8" y="47" r="1.5" fill="#FFFFFF"/>
    <rect x="1" y="60" width="14" height="3" rx="1.5" fill="#00D2FF"/>

    <!-- Left Stem of N -->
    <path d="M 28 24 L 43 24 L 43 88 L 28 88 Z" fill="url(#npBlueGradH1)" />

    <!-- N Diagonal -->
    <path d="M 41 24 L 64 74 L 64 88 L 39 38 Z" fill="url(#npBlueGradH2)"/>

    <!-- P Outer Arch -->
    <path d="M 58 24 L 102 24 C 122 24, 126 38, 126 56 C 126 74, 119 87, 98 87 L 62 87 L 62 72 L 96 72 C 108 72, 110 65, 110 56 C 110 44, 105 38, 93 38 L 58 38 Z" 
          fill="url(#npBlueGradH1)" filter="url(#npNeonFilter)"/>

    <!-- Interior Chamber -->
    <g clip-path="url(#npClipChamberH)">
      <rect x="62" y="30" width="60" height="54" fill="#040914"/>
      <!-- Scanner beam -->
      <polygon points="90 32, 76 66, 104 66" fill="#00F0FF" opacity="0.3" />
      <ellipse cx="90" cy="33" rx="3.5" ry="2" fill="#00F0FF" filter="url(#npNeonFilter)"/>

      <!-- Road & Car -->
      <path d="M 66 79 Q 80 62, 90 60 Q 100 62, 116 79 Z" fill="#0A1628" />
      <path d="M 90 62 L 90 67 M 90 71 L 90 77" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="1.5 1.5"/>

      <!-- Car -->
      <g transform="translate(82, 54)">
        <path d="M 3 6 L 5.5 2.5 L 10.5 2.5 L 13 6 Z" fill="#E2E8F0"/>
        <rect x="1.5" y="5.5" width="13" height="4.5" rx="1.2" fill="#FFFFFF"/>
        <ellipse cx="3.5" cy="7.2" rx="1.2" ry="0.8" fill="#00F0FF" filter="url(#npNeonFilter)"/>
        <ellipse cx="12.5" cy="7.2" rx="1.2" ry="0.8" fill="#00F0FF" filter="url(#npNeonFilter)"/>
        <rect x="5.5" y="7" width="5" height="1.5" rx="0.4" fill="#0A1128"/>
        <!-- AI target brackets -->
        <path d="M 0 2 L 1.5 2 M 0 2 L 0 3.5 M 16 2 L 14.5 2 M 16 2 L 16 3.5 M 0 10 L 1.5 10 M 0 10 L 0 8.5 M 16 10 L 14.5 10 M 16 10 L 16 8.5" 
              stroke="#00F0FF" stroke-width="0.7" fill="none"/>
      </g>

      <!-- Parking Display -->
      <rect x="106" y="47" width="6" height="15" rx="1" fill="#07101E" stroke="#0080FF" stroke-width="0.5"/>
      <text x="109" y="53" fill="#00D2FF" font-family="system-ui, sans-serif" font-weight="900" font-size="4" text-anchor="middle">P</text>
      <rect x="107" y="55" width="4" height="3" rx="0.5" fill="#00E676"/>
    </g>

    <!-- Curving road exiting P -->
    <path d="M 92 80 Q 72 82, 54 89 Q 44 94, 36 100 L 66 100 Q 78 92, 98 87 Z" fill="url(#npBlueGradH1)" opacity="0.85"/>
    <path d="M 36 100 Q 56 90, 84 83" stroke="#FFFFFF" stroke-width="1.3" stroke-dasharray="2.5 2.5"/>

    <!-- GPS Map Pin -->
    <g transform="translate(56, 76)">
      <circle cx="5" cy="5" r="5" fill="#00D2FF" opacity="0.4" filter="url(#npNeonFilter)"/>
      <path d="M 5 0 C 2.7 0, 0.8 1.8, 0.8 4.1 C 0.8 7, 5 11.5, 5 11.5 C 5 11.5, 9.2 7, 9.2 4.1 C 9.2 1.8, 7.3 0, 5 0 Z" fill="url(#npBlueGradH1)"/>
      <circle cx="5" cy="3.9" r="1.8" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- ==================== TYPOGRAPHY ==================== -->
  <g transform="translate(148, 0)">
    <!-- "Next Park" -->
    <text x="0" y="65" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
      Ne<tspan fill="url(#npCyanGrad)">x</tspan>t<tspan dx="8" fill="#FFFFFF">Park</tspan>
    </text>

    <!-- "AI" Badge / Electric Gradient -->
    <g transform="translate(262, 27)">
      <rect x="0" y="0" width="70" height="42" rx="8" fill="url(#npCyanGrad)" opacity="0.15" filter="url(#npNeonFilter)"/>
      <rect x="0" y="0" width="70" height="42" rx="8" fill="none" stroke="url(#npCyanGrad)" stroke-width="1.8"/>
      <text x="35" y="30" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="900" fill="url(#npCyanGrad)" text-anchor="middle" letter-spacing="1">
        AI
      </text>
    </g>

    <!-- Glowing Accent Divider Line -->
    <g transform="translate(0, 82)">
      <!-- Left cyan line cap -->
      <line x1="0" y1="0" x2="42" y2="0" stroke="url(#npCyanGrad)" stroke-width="3" stroke-linecap="round" filter="url(#npNeonFilter)"/>
      <!-- Subtitle Text -->
      <text x="54" y="5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#94A3B8" letter-spacing="4.5">
        SMART PARKING SYSTEM
      </text>
      <!-- Right cyan line cap -->
      <line x1="305" y1="0" x2="340" y2="0" stroke="url(#npCyanGrad)" stroke-width="3" stroke-linecap="round" filter="url(#npNeonFilter)"/>
    </g>
  </g>
</svg>
